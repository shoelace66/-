name: flutter_chat_demo
description: Rebuilt chat demo
publish_to: "none"
version: 2.2.0+6

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  audioplayers: 6.5.1
  http: 1.6.0
  shared_preferences: 2.5.4
  jieba_flutter: 0.2.0
  path: 1.9.1
  sqflite: 2.4.2+1
  path_provider: 2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 4.0.0
  # sqlite3 v2 组合自带 Windows 测试 DLL，完整测试不依赖 GitHub 下载。
  sqflite_common_ffi: 2.3.7+1
  sqlite3: 2.9.4

flutter:
  uses-material-design: true
  # jieba_flutter 0.2.0 从应用根 AssetBundle 读取这两个固定路径。
  assets:
    - assets/dict.txt
    - assets/prob_emit.txt
